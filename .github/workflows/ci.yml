name: CI Pipeline

on:
  push:
    branches:
      - main
      - ak
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    name: Lint, Format & Next.js Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
      MONGODB_URI: mongodb://localhost:27017/texora_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_key_minimum_32_characters_long
      NEXTAUTH_SECRET: test_nextauth_secret_placeholder_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check --ignore-unknown .

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Build
        run: npm run build
